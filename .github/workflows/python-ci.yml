name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies (requirements.txt or Poetry)
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] && grep -q 'tool.poetry' pyproject.toml 2>/dev/null; then
            pip install poetry
            poetry config virtualenvs.create false
            poetry install --no-interaction --no-ansi
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt or Poetry pyproject.toml found — skipping dependency install"
          fi

      - name: Lint (flake8) if present
        run: |
          if command -v flake8 >/dev/null 2>&1 || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            pip install --upgrade flake8 || true
            flake8 || true
          else
            echo "flake8 not configured — skipping lint"
          fi

      - name: Run tests with pytest if present
        run: |
          if [ -f pytest.ini ] || [ -d tests ] || grep -q "pytest" requirements.txt 2>/dev/null || grep -q "pytest" pyproject.toml 2>/dev/null; then
            pip install pytest pytest-cov
            pytest --cov=./ --cov-report=xml || true
          else
            echo "No tests detected — skipping pytest"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            htmlcov
            junit-*.xml

      - name: Show workspace (debug)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ls -la
